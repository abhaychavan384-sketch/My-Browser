<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#111827">
<title>MyBrowser</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f3f4f6;color:#111827}
header{background:#111827;color:#fff;padding:18px;text-align:center;font-size:24px;font-weight:700}
.wrap{max-width:900px;margin:25px auto;padding:0 15px}
.search{display:flex;gap:8px;background:#fff;padding:12px;border-radius:14px;box-shadow:0 3px 15px #0001}
input{flex:1;padding:13px;border:1px solid #d1d5db;border-radius:10px;font-size:16px;outline:none}
button{border:0;border-radius:10px;padding:12px 15px;cursor:pointer;background:#111827;color:white}
button:hover{opacity:.9}.tools{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap}
.card{background:#fff;border-radius:14px;padding:25px;box-shadow:0 3px 15px #0001}
h2{margin-top:0}.links{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.links button{background:#2563eb}
small{color:#6b7280}
.dark{background:#0b1220;color:#e5e7eb}.dark .card,.dark .search{background:#111827}.dark input{background:#1f2937;color:white;border-color:#374151}
</style>
</head>
<body>
<header>🌐 MyBrowser</header>
<div class="wrap">
  <div class="search">
    <input id="url" placeholder="Search Google or enter website..." autocomplete="off">
    <button onclick="go()">Go</button>
  </div>
  <div class="tools">
    <button onclick="history.back()">← Back</button>
    <button onclick="history.forward()">Forward →</button>
    <button onclick="location.reload()">↻ Refresh</button>
    <button onclick="home()">⌂ Home</button>
    <button onclick="toggleDark()">🌙 Dark</button>
  </div>
  <div class="card" id="home">
    <h2>Welcome to MyBrowser</h2>
    <p>Search the web or enter a website address above.</p>
    <div class="links">
      <button onclick="search('Google')">Google</button>
      <button onclick="search('YouTube')">YouTube</button>
      <button onclick="search('Wikipedia')">Wikipedia</button>
      <button onclick="search('News')">News</button>
    </div>
    <p><small>Tip: Enter example.com or type a search query.</small></p>
  </div>
</div>
<script>
const input=document.getElementById('url');
input.addEventListener('keydown',e=>{if(e.key==='Enter')go()});
function go(){
 let q=input.value.trim(); if(!q)return;
 if(/^https?:\/\//i.test(q)){location.href=q;return}
 if(/^[\w.-]+\.[a-z]{2,}(\/.*)?$/i.test(q)){location.href='https://'+q;return}
 location.href='https://www.google.com/search?q='+encodeURIComponent(q);
}
function search(q){location.href='https://www.google.com/search?q='+encodeURIComponent(q)}
function home(){location.href=location.pathname}
function toggleDark(){document.body.classList.toggle('dark');localStorage.dark=document.body.classList.contains('dark')}
if(localStorage.dark==='true')document.body.classList.add('dark');
</script>
</body>
</html>
